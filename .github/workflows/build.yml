name: Build Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e empacotar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Instalar dependências de build e testes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc python3 python3-pyqt5
      - name: Compilar, testar e gerar instalador
        run: /usr/bin/python3 tools/build.py
      - name: Disponibilizar instalador e checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-audio-bridge-linux-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
