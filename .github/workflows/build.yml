name: Build Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e empacotar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar dependências de build e testes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc python3 python3-pyqt5
      - name: Compilar, testar e gerar instalador
        run: /usr/bin/python3 tools/build.py
      - name: Disponibilizar instalador e checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-audio-bridge-linux-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
